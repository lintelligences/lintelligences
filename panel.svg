<text x="17" y="46" class="name">Lisa</text>
<text x="17" y="78" class="body">Principal Research Scientist ·</text>
<text x="17" y="100" class="body">PhD &amp; MS Geophysics</text>
<text x="17" y="136" class="body">Trying to make sense of complicated things, build new ones, and occasionally wander off into the</text>
<text x="17" y="158" class="body">mountains.</text>
<rect x="17" y="194" width="56" height="3" class="accent"/>
<text x="17.0" y="234" class="label">NOW SERVING</text>
<text x="17.0" y="264" class="body"><tspan class="accent">› </tspan>Compost, shrapnel, and tooling</text>
<text x="17.0" y="286" class="body">  from outside my work world.</text>
<text x="17.0" y="316" class="body"><tspan class="accent">› </tspan>Libraries · Launchers ·</text>
<text x="17.0" y="338" class="body">  Discovery Systems</text>
<text x="334.0" y="234" class="label">INTERESTS</text>
<text x="334.0" y="264" class="body"><tspan class="accent">› </tspan>Knowledge compression and</text>
<text x="334.0" y="286" class="body">  evolutions</text>
<text x="334.0" y="316" class="body"><tspan class="accent">› </tspan>Wold models and geospatial</text>
<text x="334.0" y="338" class="body">  intelligence</text>
<text x="334.0" y="368" class="body"><tspan class="accent">› </tspan>Cooperative Autonomy</text>
<text x="334.0" y="398" class="body"><tspan class="accent">› </tspan>Learning paradigms and physical</text>
<text x="334.0" y="420" class="body">  systems</text>
<text x="651.0" y="234" class="label">HOW I WORK</text>
<text x="651.0" y="264" class="body"><tspan class="accent">› </tspan>Ask dumb questions, a lot of</text>
<text x="651.0" y="286" class="body">  them</text>
<text x="651.0" y="316" class="body"><tspan class="accent">› </tspan>Find the thing that matters</text>
<text x="651.0" y="338" class="body">  most</text>
<text x="651.0" y="368" class="body"><tspan class="accent">› </tspan>Design, build, analyze</text>
<text x="651.0" y="398" class="body"><tspan class="accent">› </tspan>Repeat</text>
